<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Vector Climax Strike</title>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#020208">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Black+Ops+One&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
  /* single dark arcade look on purpose: the game screen is the same in either theme */
  :root{ --bg:#05060b; --pink:#ff4fd8; --cyan:#40f0ff; --fg:#ffffff; color-scheme:dark; }
  html,body{ margin:0; height:100%; background:var(--bg); color:var(--fg); overflow:hidden; touch-action:none; user-select:none; -webkit-user-select:none; }
  canvas{ position:fixed; left:0; top:0; display:block; }
  #gl{ z-index:1; }
  body.pixel #gl, #gl.pixel{ image-rendering:pixelated; image-rendering:crisp-edges; }
  #hud{ z-index:2; pointer-events:none; }
  #load{ position:fixed; inset:0; z-index:9; display:flex; align-items:center; justify-content:center; font:20px 'Share Tech Mono',monospace; color:var(--cyan); background:var(--bg); letter-spacing:.2em; text-align:center; padding:16px; }
  #touch{ position:fixed; inset:0; z-index:3; display:none; touch-action:none; -webkit-touch-callout:none; -webkit-tap-highlight-color:transparent; }
  /* steering stick: rests bottom-left as a hint, jumps under the thumb when touched */
  #tstick{ position:absolute; left:calc(28px + env(safe-area-inset-left,0px)); bottom:calc(28px + env(safe-area-inset-bottom,0px)); width:140px; height:140px; border-radius:50%;
    border:2px solid rgba(64,240,255,.35); background:radial-gradient(circle,rgba(64,240,255,.10),rgba(64,240,255,0) 70%); opacity:.55; pointer-events:none; transition:opacity .15s; }
  #tstick::after{ content:'DRAG TO STEER'; position:absolute; left:0; right:0; top:-22px; text-align:center; font:11px 'Share Tech Mono',monospace; letter-spacing:.12em; color:rgba(64,240,255,.8); }
  #tstick.live{ bottom:auto; opacity:1; border-color:rgba(64,240,255,.75); transition:none; }
  #tstick.live::after, #tstick.used::after{ display:none; }
  #tstick.used:not(.live){ opacity:.3; }
  #tknob{ position:absolute; left:45px; top:45px; width:50px; height:50px; border-radius:50%; background:rgba(64,240,255,.45); box-shadow:0 0 18px rgba(64,240,255,.6); }
  .tb{ position:absolute; border-radius:50%; border:2px solid rgba(255,255,255,.5); color:#fff; font:12px 'Black Ops One',sans-serif; letter-spacing:.04em; display:flex; align-items:center; justify-content:center; background:rgba(6,8,18,.35); user-select:none; -webkit-user-select:none; }
  .tb.on{ background:rgba(255,79,216,.55); transform:scale(.94); }
  #touch[data-mode="menu"] .tb, #touch[data-mode="wait"] .tb:not([data-b="pause"]), #touch[data-mode="menu"] #tstick, #touch[data-mode="wait"] #tstick{ display:none; }
  .tb[data-b="mis"]{ right:calc(24px + env(safe-area-inset-right,0px)); bottom:calc(30px + env(safe-area-inset-bottom,0px)); width:104px; height:104px; border-color:var(--pink); font-size:14px; background:rgba(60,8,46,.4); }
  .tb{ background:rgba(6,8,18,.22); }
  .tb[data-b="gun"]{ right:calc(136px + env(safe-area-inset-right,0px)); bottom:calc(24px + env(safe-area-inset-bottom,0px)); width:80px; height:80px; border-color:#ffd23a; font-size:13px; background:rgba(50,40,4,.3); }
  .tb[data-b="clx"]{ right:calc(132px + env(safe-area-inset-right,0px)); bottom:calc(114px + env(safe-area-inset-bottom,0px)); width:68px; height:68px; border-color:var(--cyan); font-size:11px; }
  .tb[data-b="roll"]{ right:calc(26px + env(safe-area-inset-right,0px)); bottom:calc(144px + env(safe-area-inset-bottom,0px)); width:62px; height:62px; }
  /* throttle on touch (one thumb per side): BOOST / BRAKE sit by the right thumb; a tap = 3 s full throttle (brake 2.2 s), holding keeps
     it; afterwards the lever eases back to cruise. They pulse when an ACCELERATE / BRAKE prompt is up. */
  .tb[data-b="boost"]{ right:calc(20px + env(safe-area-inset-right,0px)); bottom:calc(214px + env(safe-area-inset-bottom,0px)); width:58px; height:58px; font-size:11px; border-color:#40f0ff; }
  .tb[data-b="brake"]{ right:calc(134px + env(safe-area-inset-right,0px)); bottom:calc(196px + env(safe-area-inset-bottom,0px)); width:54px; height:54px; font-size:11px; border-color:#ffb02e; }
  .tb.cue{ animation:cue .45s ease-in-out infinite alternate; }
  .tb[data-b="boost"].cue{ background:rgba(64,240,255,.45); box-shadow:0 0 22px rgba(64,240,255,.9); }
  .tb[data-b="brake"].cue{ background:rgba(255,176,46,.45); box-shadow:0 0 22px rgba(255,176,46,.9); }
  @keyframes cue{ from{ transform:scale(1); } to{ transform:scale(1.12); } }
  .tb[data-b="clx"].ready{ background:rgba(64,240,255,.4); box-shadow:0 0 22px rgba(64,240,255,.8); }
  .tb[data-b="pause"]{ right:calc(14px + env(safe-area-inset-right,0px)); top:calc(64px + env(safe-area-inset-top,0px)); width:44px; height:44px; font-size:12px; }
  @media (orientation:portrait){ .tb[data-b="pause"]{ top:calc(132px + env(safe-area-inset-top,0px)); } }
  @media (max-height:430px){ #tstick{ width:120px; height:120px; } #tknob{ left:35px; top:35px; } .tb[data-b="mis"]{ width:92px; height:92px; } .tb[data-b="gun"]{ right:calc(124px + env(safe-area-inset-right,0px)); width:74px; height:74px; } .tb[data-b="clx"]{ right:calc(122px + env(safe-area-inset-right,0px)); bottom:calc(104px + env(safe-area-inset-bottom,0px)); width:62px; height:62px; } .tb[data-b="roll"]{ bottom:calc(128px + env(safe-area-inset-bottom,0px)); width:58px; height:58px; } .tb[data-b="boost"]{ bottom:calc(202px + env(safe-area-inset-bottom,0px)); width:52px; height:52px; } .tb[data-b="brake"]{ right:calc(124px + env(safe-area-inset-right,0px)); bottom:calc(180px + env(safe-area-inset-bottom,0px)); width:50px; height:50px; } }
  /* touch size option (S / M / L) */
  #touch .tb{ zoom:var(--ts,1); }
  /* FEEDBACK panel (DOM so the note can use the phone keyboard) */
  #fb{ position:fixed; inset:0; z-index:8; display:none; align-items:center; justify-content:center; background:rgba(2,4,12,.78); font:14px 'Share Tech Mono',monospace; color:#fff; }
  #fb .fbbox{ width:min(520px,92vw); max-height:94vh; overflow:auto; background:#0a0c1a; border:1.5px solid #ff4fd8; padding:14px 16px; box-sizing:border-box; }
  #fb .fbt{ font:22px 'Black Ops One',sans-serif; color:#ff4fd8; margin-bottom:8px; }
  #fb .fbq{ display:flex; align-items:center; gap:6px; margin:6px 0; flex-wrap:wrap; } #fb .fbq span{ flex:1 1 130px; color:#40f0ff; }
  #fb button{ min-width:44px; min-height:44px; background:#141830; color:#fff; border:1px solid rgba(255,255,255,.35); font:16px 'Black Ops One',sans-serif; border-radius:6px; }
  #fb button.on{ background:#ff4fd8; border-color:#fff; } #fb button:focus{ outline:2px solid #ffd23a; }
  #fb textarea{ width:100%; box-sizing:border-box; height:64px; margin:8px 0; background:#05060b; color:#fff; border:1px solid rgba(255,255,255,.3); font:14px 'Share Tech Mono',monospace; padding:6px; }
  #fb .fbr{ display:flex; gap:10px; } #fb .fbr button{ flex:1; } #fbmsg{ color:#ffd23a; margin-top:6px; min-height:18px; }
</style>
<canvas id="gl"></canvas>
<canvas id="hud"></canvas>
<div id="touch">
  <div id="tstick"><div id="tknob"></div></div>
  <div class="tb" data-b="mis">MISSILE</div>
  <div class="tb" data-b="gun">GUN</div>
  <div class="tb" data-b="clx">CLIMAX</div>
  <div class="tb" data-b="roll">ROLL</div>
  <div class="tb" data-b="boost">BOOST</div>
  <div class="tb" data-b="brake">BRAKE</div>
  <div class="tb" data-b="pause">II</div>
</div>
<div id="load">LOADING VECTOR SQUADRON...</div>
